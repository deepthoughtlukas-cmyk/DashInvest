name: Deploy Live API Proxy to Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'server/providers/**'
      - 'server/macroOverview.ts'
      - 'server/cache.ts'
      - 'shared/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare API Token
        id: check_token
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN secret is not set yet — skipping automated Worker deploy."
          fi

      - name: Setup Node.js
        if: steps.check_token.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.check_token.outputs.configured == 'true'
        run: npm ci

      - name: Run Worker tests
        if: steps.check_token.outputs.configured == 'true'
        run: npx vitest run tests/worker.test.ts

      - name: Deploy Cloudflare Worker
        if: steps.check_token.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: deploy
